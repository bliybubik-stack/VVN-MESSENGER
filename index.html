<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
    <title>VVN Messenger</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Three.js & Vanta.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.waves.min.js"></script>

    <!-- GSAP -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>

    <!-- Anime.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0A0A0A;
            color: #FFFFFF;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Vanta Background */
        #vanta-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        /* Glassmorphism Base */
        .glass {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .glass-light {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .glass-dark {
            background: rgba(10, 10, 10, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
            border-radius: 16px;
            position: relative;
            overflow: hidden;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
        }

        /* Liquid Glass Effect - Telegram Style */
        .liquid-glass {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                inset 0 -1px 0 rgba(255, 255, 255, 0.04);
            transition: all 0.3s ease;
        }

        .liquid-glass:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.08);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.3);
        }

        .liquid-glass-dark {
            background: rgba(10, 10, 10, 0.6);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }

        /* ============================================
           TELEGRAM-STYLE BOTTOM NAVIGATION
           ============================================ */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 50;
            background: rgba(10, 10, 10, 0.7);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            justify-content: space-around;
            padding: 8px 0 env(safe-area-inset-bottom, 0px) 0;
            height: 64px;
        }

        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            padding: 4px 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #666;
            text-decoration: none;
            position: relative;
            flex: 1;
            max-width: 80px;
            background: transparent;
            border: none;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .bottom-nav .nav-item svg {
            width: 24px;
            height: 24px;
            stroke-width: 1.6;
            transition: all 0.3s ease;
        }

        .bottom-nav .nav-item.active {
            color: #FFFFFF;
        }

        .bottom-nav .nav-item.active svg {
            stroke: #FFFFFF;
            fill: rgba(255, 255, 255, 0.1);
        }

        .bottom-nav .nav-item .badge {
            position: absolute;
            top: 2px;
            right: 8px;
            background: #36454F;
            color: #fff;
            font-size: 9px;
            font-weight: 600;
            min-width: 16px;
            height: 16px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
        }

        .bottom-nav .nav-item:active {
            transform: scale(0.92);
        }

        /* ============================================
           CHAT LIST - Telegram Style
           ============================================ */
        .chat-list-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            border-radius: 12px;
            margin: 2px 8px;
            position: relative;
        }

        .chat-list-item:active {
            transform: scale(0.97);
            background: rgba(255, 255, 255, 0.04);
        }

        .chat-list-item .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 18px;
            background: rgba(255, 255, 255, 0.06);
            color: #aaa;
            border: 1px solid rgba(255, 255, 255, 0.04);
            position: relative;
        }

        .chat-list-item .avatar .online-dot {
            position: absolute;
            bottom: 1px;
            right: 1px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid #0A0A0A;
        }

        .chat-list-item .avatar .online-dot.online {
            background: #44c767;
        }

        .chat-list-item .chat-info {
            flex: 1;
            min-width: 0;
        }

        .chat-list-item .chat-info .name {
            font-weight: 500;
            font-size: 15px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .chat-list-item .chat-info .name .tag {
            font-size: 8px;
            padding: 0 6px;
            border-radius: 4px;
            font-weight: 600;
        }

        .chat-list-item .chat-info .last-msg {
            font-size: 13px;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        .chat-list-item .chat-info .last-msg .sender {
            color: #888;
        }

        .chat-list-item .chat-meta {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
            flex-shrink: 0;
        }

        .chat-list-item .chat-meta .time {
            font-size: 11px;
            color: #555;
        }

        .chat-list-item .chat-meta .unread {
            background: #36454F;
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            min-width: 18px;
            height: 18px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 6px;
        }

        .chat-list-item .chat-meta .pinned-icon {
            color: #555;
            font-size: 12px;
        }

        /* ============================================
           CHAT VIEW - Telegram Style
           ============================================ */
        .chat-view {
            display: none;
            flex-direction: column;
            height: 100vh;
            position: fixed;
            inset: 0;
            z-index: 60;
            background: #0A0A0A;
        }

        .chat-view.active {
            display: flex;
        }

        .chat-view-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
            min-height: 56px;
        }

        .chat-view-header .back-btn {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            padding: 4px;
            border-radius: 8px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-view-header .back-btn:active {
            transform: scale(0.9);
        }

        .chat-view-header .back-btn svg {
            width: 24px;
            height: 24px;
        }

        .chat-view-header .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.06);
            color: #aaa;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .chat-view-header .info {
            flex: 1;
            min-width: 0;
        }

        .chat-view-header .info .name {
            font-weight: 500;
            font-size: 15px;
            color: #fff;
        }

        .chat-view-header .info .status {
            font-size: 12px;
            color: #666;
        }

        .chat-view-header .actions {
            display: flex;
            gap: 4px;
        }

        .chat-view-header .actions button {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-view-header .actions button:active {
            transform: scale(0.9);
            background: rgba(255,255,255,0.04);
        }

        .chat-view-header .actions button svg {
            width: 20px;
            height: 20px;
        }

        /* Messages */
        .chat-messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            scroll-behavior: smooth;
        }

        .message-bubble {
            max-width: 80%;
            padding: 8px 14px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            position: relative;
            animation: messageIn 0.2s ease;
        }

        .message-bubble.outgoing {
            align-self: flex-end;
            background: rgba(54, 69, 79, 0.6);
            border-bottom-right-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .message-bubble.incoming {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.04);
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .message-bubble .time {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 4px;
            text-align: right;
        }

        .message-bubble.incoming .time {
            color: #555;
        }

        @keyframes messageIn {
            from { opacity: 0; transform: translateY(8px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Input Bar */
        .chat-input-container {
            padding: 8px 12px 12px;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
            position: relative;
        }

        .chat-input-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 24px;
            padding: 4px 4px 4px 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.3s ease;
        }

        .chat-input-wrapper:focus-within {
            border-color: rgba(255, 255, 255, 0.12);
        }

        .chat-input-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 15px;
            padding: 8px 0;
            outline: none;
            min-height: 36px;
            max-height: 100px;
            resize: none;
        }

        .chat-input-wrapper input::placeholder {
            color: #555;
        }

        .chat-input-wrapper .input-actions {
            display: flex;
            align-items: center;
            gap: 2px;
            flex-shrink: 0;
        }

        .chat-input-wrapper .input-actions button {
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-input-wrapper .input-actions button:active {
            transform: scale(0.9);
            background: rgba(255,255,255,0.04);
        }

        .chat-input-wrapper .input-actions button svg {
            width: 20px;
            height: 20px;
        }

        .chat-input-wrapper .input-actions .send-btn {
            background: #36454F;
            border-radius: 50%;
            padding: 8px;
            color: #fff;
        }

        .chat-input-wrapper .input-actions .send-btn:active {
            transform: scale(0.9);
        }

        .chat-input-wrapper .input-actions .send-btn svg {
            width: 18px;
            height: 18px;
        }

        /* ============================================
           TELEGRAM-STYLE TABS
           ============================================ */
        .tab-content {
            display: none;
            height: calc(100vh - 64px);
            overflow-y: auto;
            padding-bottom: 80px;
        }

        .tab-content.active {
            display: block;
        }

        .tab-content .tab-header {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
        }

        .tab-content .tab-header h2 {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
        }

        .tab-content .tab-header .actions {
            display: flex;
            gap: 8px;
        }

        .tab-content .tab-header .actions button {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            padding: 4px;
            border-radius: 8px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tab-content .tab-header .actions button:active {
            transform: scale(0.9);
        }

        .tab-content .tab-header .actions button svg {
            width: 20px;
            height: 20px;
        }

        /* ============================================
           PROFILE TAB
           ============================================ */
        .profile-header-card {
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .profile-header-card .avatar-large {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            border: 2px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 600;
            color: #aaa;
            margin-bottom: 12px;
        }

        .profile-header-card .name {
            font-size: 20px;
            font-weight: 600;
            color: #fff;
        }

        .profile-header-card .username {
            font-size: 14px;
            color: #666;
            margin-top: 2px;
        }

        .profile-header-card .bio {
            font-size: 14px;
            color: #888;
            margin-top: 8px;
        }

        .profile-header-card .status {
            font-size: 13px;
            color: #555;
            margin-top: 4px;
        }

        .profile-menu-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            border-radius: 12px;
            margin: 2px 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .profile-menu-item:active {
            transform: scale(0.97);
            background: rgba(255, 255, 255, 0.04);
        }

        .profile-menu-item .icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            flex-shrink: 0;
        }

        .profile-menu-item .icon svg {
            width: 18px;
            height: 18px;
        }

        .profile-menu-item .info {
            flex: 1;
        }

        .profile-menu-item .info .title {
            font-size: 14px;
            color: #fff;
        }

        .profile-menu-item .info .desc {
            font-size: 12px;
            color: #555;
        }

        .profile-menu-item .arrow {
            color: #555;
        }

        .profile-menu-item .arrow svg {
            width: 16px;
            height: 16px;
        }

        /* ============================================
           SETTINGS TAB
           ============================================ */
        .settings-section {
            padding: 8px 0;
        }

        .settings-section .section-title {
            font-size: 12px;
            font-weight: 600;
            color: #555;
            padding: 8px 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .settings-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 16px;
            border-radius: 12px;
            margin: 2px 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .settings-item:active {
            transform: scale(0.97);
            background: rgba(255, 255, 255, 0.04);
        }

        .settings-item .icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            flex-shrink: 0;
        }

        .settings-item .icon svg {
            width: 16px;
            height: 16px;
        }

        .settings-item .info {
            flex: 1;
        }

        .settings-item .info .title {
            font-size: 14px;
            color: #fff;
        }

        .settings-item .info .desc {
            font-size: 12px;
            color: #555;
        }

        .settings-item .toggle {
            color: #666;
        }

        .settings-item .toggle .switch {
            position: relative;
            width: 40px;
            height: 22px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 11px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .settings-item .toggle .switch.active {
            background: #36454F;
        }

        .settings-item .toggle .switch .thumb {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 18px;
            height: 18px;
            background: #666;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .settings-item .toggle .switch.active .thumb {
            transform: translateX(18px);
            background: #fff;
        }

        /* ============================================
           CONTACTS TAB
           ============================================ */
        .contact-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            border-radius: 12px;
            margin: 2px 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .contact-item:active {
            transform: scale(0.97);
            background: rgba(255, 255, 255, 0.04);
        }

        .contact-item .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.06);
            color: #aaa;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .contact-item .info {
            flex: 1;
        }

        .contact-item .info .name {
            font-size: 14px;
            color: #fff;
        }

        .contact-item .info .status {
            font-size: 12px;
            color: #555;
        }

        /* ============================================
           SCROLLBAR
           ============================================ */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* ============================================
           ANIMATIONS
           ============================================ */
        .fade-in {
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .slide-up {
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ============================================
           LOADING
           ============================================ */
        .loader {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.04);
            border-top: 3px solid #36454F;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loader-bar {
            width: 200px;
            height: 3px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 4px;
            overflow: hidden;
        }

        .loader-bar .fill {
            height: 100%;
            width: 0%;
            background: #36454F;
            border-radius: 4px;
            transition: width 0.3s;
        }

        .tag-owner { background: #ffd700; color: #000; }
        .tag-ceo { background: #ff6b6b; color: #fff; }
        .tag-dev { background: #4ecdc4; color: #000; }
        .tag-admin { background: #45b7d1; color: #fff; }
        .tag-mod { background: #a29bfe; color: #fff; }
        .tag-xtra { background: #fd79a8; color: #fff; }
        .tag-staff { background: #fdcb6e; color: #000; }
        .tag-member { background: rgba(255,255,255,0.06); color: #999; }
        .tag-guest { background: rgba(255,255,255,0.03); color: #666; }

        /* Safe area for bottom nav */
        @supports (padding: env(safe-area-inset-bottom)) {
            .bottom-nav {
                padding-bottom: env(safe-area-inset-bottom, 0px);
            }
            .chat-input-container {
                padding-bottom: max(12px, env(safe-area-inset-bottom, 12px));
            }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="app">

        <!-- Vanta Background -->
        <div id="vanta-bg"></div>

        <!-- Loading Overlay -->
        <div id="loadingOverlay" class="fixed inset-0 z-[999] flex items-center justify-center bg-[#0A0A0A] transition-opacity duration-400">
            <div class="flex flex-col items-center gap-6">
                <div class="loader"></div>
                <div class="loader-bar">
                    <div class="fill" id="loaderFill"></div>
                </div>
                <p class="text-[#555] text-sm tracking-[2px]">SECURE CONNECTION ESTABLISHING...</p>
            </div>
        </div>

        <!-- Auth Screen -->
        <div id="authScreen" class="fixed inset-0 z-[150] flex items-center justify-center bg-[#0A0A0A] hidden">
            <div class="w-full max-w-md px-4">
                <div class="text-center mb-8">
                    <img src="icons/logo.png" alt="VVN" class="w-20 h-20 mx-auto mb-4 rounded-2xl glass p-2" />
                    <h1 class="text-3xl font-medium text-white">VVN</h1>
                    <p class="text-[#666] text-sm tracking-[3px]">VEIL-VAULT-NET</p>
                </div>
                <div class="glass-card p-6">
                    <div class="flex gap-1 bg-[rgba(20,20,20,0.3)] rounded-xl p-1 mb-5">
                        <button class="auth-tab flex-1 py-2 text-sm font-medium text-[#666] rounded-lg transition-all active" data-tab="login">Sign in</button>
                        <button class="auth-tab flex-1 py-2 text-sm font-medium text-[#666] rounded-lg transition-all" data-tab="register">Create account</button>
                    </div>

                    <form id="loginForm" class="auth-form flex flex-col gap-3">
                        <div class="relative">
                            <i data-lucide="user" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-[#555]"></i>
                            <input type="text" id="loginUsername" placeholder="USERNAME" class="w-full pl-10 pr-4 py-3 rounded-xl bg-[rgba(40,40,40,0.3)] border border-[rgba(255,255,255,0.04)] text-white text-sm outline-none transition-all focus:border-[#36454F]" />
                        </div>
                        <div class="relative">
                            <i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-[#555]"></i>
                            <input type="password" id="loginPassword" placeholder="PASSWORD" class="w-full pl-10 pr-4 py-3 rounded-xl bg-[rgba(40,40,40,0.3)] border border-[rgba(255,255,255,0.04)] text-white text-sm outline-none transition-all focus:border-[#36454F]" />
                        </div>
                        <button type="submit" class="w-full py-3 rounded-xl bg-[#36454F] text-white font-medium text-sm transition-all hover:bg-[#41424C] active:scale-[0.97]">Enter VVN</button>
                        <div id="authError" class="text-red-400 text-xs bg-red-400/10 px-3 py-2 rounded-lg border border-red-400/20 hidden"></div>
                    </form>

                    <form id="registerForm" class="auth-form hidden flex-col gap-3">
                        <div class="relative">
                            <i data-lucide="user" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-[#555]"></i>
                            <input type="text" id="regUsername" placeholder="USERNAME" class="w-full pl-10 pr-4 py-3 rounded-xl bg-[rgba(40,40,40,0.3)] border border-[rgba(255,255,255,0.04)] text-white text-sm outline-none transition-all focus:border-[#36454F]" />
                        </div>
                        <div class="relative">
                            <i data-lucide="pen-line" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-[#555]"></i>
                            <input type="text" id="regDisplayName" placeholder="DISPLAY NAME" class="w-full pl-10 pr-4 py-3 rounded-xl bg-[rgba(40,40,40,0.3)] border border-[rgba(255,255,255,0.04)] text-white text-sm outline-none transition-all focus:border-[#36454F]" />
                        </div>
                        <div class="relative">
                            <i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-[#555]"></i>
                            <input type="password" id="regPassword" placeholder="PASSWORD" class="w-full pl-10 pr-4 py-3 rounded-xl bg-[rgba(40,40,40,0.3)] border border-[rgba(255,255,255,0.04)] text-white text-sm outline-none transition-all focus:border-[#36454F]" />
                        </div>
                        <button type="submit" class="w-full py-3 rounded-xl bg-[#36454F] text-white font-medium text-sm transition-all hover:bg-[#41424C] active:scale-[0.97]">Create account</button>
                        <div id="regError" class="text-red-400 text-xs bg-red-400/10 px-3 py-2 rounded-lg border border-red-400/20 hidden"></div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Messenger - Telegram Style -->
        <div id="messenger" class="fixed inset-0 z-[100] hidden flex flex-col bg-[#0A0A0A]">

            <!-- Status Bar -->
            <div class="flex items-center justify-between px-4 py-1.5 glass-dark border-b border-[rgba(255,255,255,0.04)] flex-shrink-0 min-h-[32px] z-10">
                <span class="text-[#666] text-xs">
                    <span class="status-dot" id="syncDot"></span>
                    <span id="syncStatus">Initializing...</span>
                </span>
                <button class="flex items-center gap-1.5 glass px-3 py-0.5 rounded-xl text-[#666] text-xs transition-all active:scale-95" id="manualSyncBtn">
                    <i data-lucide="refresh-cw" class="w-3 h-3"></i>
                    Sync
                </button>
            </div>

            <!-- Tabs Content -->
            <div class="flex-1 overflow-hidden relative">

                <!-- Chats Tab -->
                <div class="tab-content active" id="tab-chats">
                    <div class="tab-header">
                        <h2>Chats</h2>
                        <div class="actions">
                            <button id="newChatBtn" class="active:scale-90"><i data-lucide="square-pen" class="w-5 h-5"></i></button>
                            <button id="searchChatBtn" class="active:scale-90"><i data-lucide="search" class="w-5 h-5"></i></button>
                        </div>
                    </div>
                    <div id="chatListContainer" class="p-2 pb-24">
                        <!-- Chat list rendered by JS -->
                    </div>
                </div>

                <!-- Contacts Tab -->
                <div class="tab-content" id="tab-contacts">
                    <div class="tab-header">
                        <h2>Contacts</h2>
                        <div class="actions">
                            <button id="addContactBtn" class="active:scale-90"><i data-lucide="user-plus" class="w-5 h-5"></i></button>
                        </div>
                    </div>
                    <div id="contactsContainer" class="p-2 pb-24">
                        <!-- Contacts rendered by JS -->
                    </div>
                </div>

                <!-- Settings Tab -->
                <div class="tab-content" id="tab-settings">
                    <div class="tab-header">
                        <h2>Settings</h2>
                    </div>
                    <div class="p-2 pb-24">
                        <!-- Settings rendered by JS -->
                    </div>
                </div>

                <!-- Profile Tab -->
                <div class="tab-content" id="tab-profile">
                    <div class="p-2 pb-24">
                        <!-- Profile rendered by JS -->
                    </div>
                </div>

            </div>

            <!-- Bottom Navigation -->
            <div class="bottom-nav">
                <button class="nav-item active" data-tab="chats" id="nav-chats">
                    <i data-lucide="message-square"></i>
                    <span>Chats</span>
                    <span class="badge" id="chatBadge">0</span>
                </button>
                <button class="nav-item" data-tab="contacts" id="nav-contacts">
                    <i data-lucide="users"></i>
                    <span>Contacts</span>
                </button>
                <button class="nav-item" data-tab="settings" id="nav-settings">
                    <i data-lucide="settings"></i>
                    <span>Settings</span>
                </button>
                <button class="nav-item" data-tab="profile" id="nav-profile">
                    <i data-lucide="user"></i>
                    <span>Profile</span>
                </button>
            </div>
        </div>

        <!-- Chat View (Opens when clicking a chat) -->
        <div class="chat-view" id="chatView">
            <div class="chat-view-header">
                <button class="back-btn" id="chatBackBtn">
                    <i data-lucide="arrow-left"></i>
                </button>
                <div class="avatar" id="chatViewAvatar">👤</div>
                <div class="info">
                    <div class="name" id="chatViewName">Contact</div>
                    <div class="status" id="chatViewStatus">online</div>
                </div>
                <div class="actions">
                    <button id="chatViewMenu"><i data-lucide="more-vertical"></i></button>
                </div>
            </div>

            <div class="chat-messages-container" id="chatMessagesContainer">
                <!-- Messages rendered by JS -->
            </div>

            <div class="chat-input-container">
                <div class="chat-input-wrapper">
                    <button id="chatAttachBtn" class="active:scale-90"><i data-lucide="paperclip" class="w-5 h-5"></i></button>
                    <button id="chatSmileBtn" class="active:scale-90"><i data-lucide="smile" class="w-5 h-5"></i></button>
                    <input id="chatMessageInput" placeholder="Message" />
                    <div class="input-actions">
                        <button id="chatMicBtn" class="active:scale-90"><i data-lucide="mic" class="w-5 h-5"></i></button>
                        <button class="send-btn active:scale-90" id="chatSendBtn"><i data-lucide="send"></i></button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modals -->
        <div id="settingsModal" class="fixed inset-0 z-[200] bg-[rgba(0,0,0,0.7)] backdrop-blur-lg hidden items-center justify-center">
            <div class="glass-card p-6 max-w-md w-full mx-4 max-h-[90vh] overflow-y-auto">
                <button class="modal-close float-right text-[#666] hover:text-white" id="settingsModalClose"><i data-lucide="x" class="w-5 h-5"></i></button>
                <h2 class="text-white font-medium text-xl mb-4">Settings</h2>
                <!-- Settings content rendered by JS -->
                <div id="settingsModalContent"></div>
            </div>
        </div>

        <div id="profileModal" class="fixed inset-0 z-[200] bg-[rgba(0,0,0,0.7)] backdrop-blur-lg hidden items-center justify-center">
            <div class="glass-card p-6 max-w-md w-full mx-4 max-h-[90vh] overflow-y-auto">
                <button class="modal-close float-right text-[#666] hover:text-white" id="profileModalClose"><i data-lucide="x" class="w-5 h-5"></i></button>
                <div id="profileModalContent"></div>
            </div>
        </div>

    </div>

    <script>
        // Initialize Lucide icons
        document.addEventListener('DOMContentLoaded', function() {
            lucide.createIcons();
        });
    </script>

    <script src="config.js"></script>
    <script src="crypto.js"></script>
    <script src="database.js"></script>
    <script src="device-layouts.js"></script>
    <script src="telegram-ui.js"></script>
    <script src="app.js"></script>
</body>
    </html>
