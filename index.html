<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>VVN · secure messenger</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="app">
        <div id="loadingOverlay">
            <p>LOADING SECURE CONNECTION...</p>
            <div class="loader-bar"><div class="fill" id="loaderFill"></div></div>
            <p style="font-size:0.7rem;color:#555;" id="loadingStatus">Initializing encryption...</p>
        </div>

        <div id="authScreen">
            <div class="auth-box">
                <h1>VVN <small>· secure</small></h1>
                <p>🔒 end‑to‑end encrypted</p>
                <input class="auth-input" id="authUsername" placeholder="Username" autocomplete="username" />
                <input class="auth-input" id="authEmail" placeholder="Email (optional)" autocomplete="email" />
                <input class="auth-input" id="authPassword" type="password" placeholder="Password" autocomplete="current-password" />
                <div class="auth-actions">
                    <button class="btn btn-primary" id="loginBtn">Login</button>
                    <button class="btn btn-secondary" id="signupBtn">Sign Up</button>
                </div>
                <div id="authError" class="auth-error"></div>
                <div class="auth-extra"><span>🔐 5-layer encryption</span></div>
            </div>
        </div>

        <div id="messenger">
            <div id="statusBar">
                <span><span class="status-dot" id="syncDot"></span><span id="syncStatus">Initializing...</span></span>
                <div style="display:flex;gap:8px;align-items:center;">
                    <button class="manual-sync-btn" id="settingsBtn">⚙️</button>
                    <button class="manual-sync-btn" id="manualSyncBtn">⟳ Sync</button>
                </div>
            </div>
            <div class="messenger-layout">
                <div class="sidebar" id="sidebar">
                    <div class="sidebar-header">
                        <div class="logo-bar">
                            <h2>VVN</h2>
                            <div class="user-badge" id="userBadge" style="cursor:pointer;">
                                <span class="status-dot"></span>
                                <span id="sidebarUsername">user</span>
                            </div>
                        </div>
                        <div class="search-wrap">
                            <input id="searchInput" placeholder="Search users..." autocomplete="off" />
                            <div id="searchResults" class="search-results"></div>
                        </div>
                    </div>
                    <div class="chat-list" id="chatList"></div>
                </div>

                <div class="chat-area" id="chatArea">
                    <div id="chatPlaceholder" class="chat-placeholder">✨ Your chats will appear here</div>
                    <div id="chatActive" style="display:flex; flex-direction:column; height:100%; min-height:0;">
                        <div class="chat-header" id="chatHeader" style="display:none;">
                            <button class="back-btn" id="backBtn">‹</button>
                            <div class="avatar" id="chatAvatar">👤</div>
                            <div style="flex:1; min-width:0;">
                                <div class="chatuser" id="chatPartnerName"></div>
                                <div class="status" id="chatPartnerStatus">offline</div>
                            </div>
                            <div style="display:flex;gap:6px;">
                                <button class="chat-action-btn" id="selectMsgBtn" title="Select messages">☑</button>
                                <button class="chat-action-btn" id="reactBtn" title="React to message">😊</button>
                            </div>
                        </div>
                        <div class="chat-messages" id="chatMessages"></div>
                        <div class="chat-input-bar" id="chatInputBar" style="display:none;">
                            <input id="messageInput" placeholder="Type a message..." autocomplete="off" />
                            <button id="sendBtn">Send</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Account Settings</h2>
                <button class="modal-close" id="closeSettings">×</button>
            </div>
            <div class="modal-body">
                <div class="settings-section">
                    <h3>Profile</h3>
                    <div class="setting-item">
                        <label>Profile Picture URL</label>
                        <input id="setProfilePic" placeholder="https://example.com/avatar.jpg" />
                    </div>
                    <div class="setting-item">
                        <label>Display Name</label>
                        <input id="setDisplayName" placeholder="Your display name" />
                    </div>
                    <div class="setting-item">
                        <label>Bio</label>
                        <textarea id="setBio" placeholder="Tell people about yourself..." rows="2"></textarea>
                    </div>
                </div>
                <div class="settings-section">
                    <h3>Account</h3>
                    <div class="setting-item">
                        <label>Username</label>
                        <input id="setUsername" placeholder="Username" />
                    </div>
                    <div class="setting-item">
                        <label>Email</label>
                        <input id="setEmail" placeholder="Email" type="email" />
                    </div>
                    <div class="setting-item">
                        <label>New Password</label>
                        <input id="setPassword" placeholder="New password" type="password" />
                    </div>
                </div>
                <div class="settings-section">
                    <h3>Privacy & Security</h3>
                    <div class="setting-item">
                        <label>Last Seen</label>
                        <select id="setLastSeen">
                            <option value="everyone">Everyone</option>
                            <option value="contacts">Contacts</option>
                            <option value="none">Nobody</option>
                        </select>
                    </div>
                    <div class="setting-item">
                        <label>Read Receipts</label>
                        <select id="setReadReceipts">
                            <option value="on">On</option>
                            <option value="off">Off</option>
                        </select>
                    </div>
                    <div class="setting-item">
                        <label>Encryption Level</label>
                        <select id="setEncryption">
                            <option value="5">5-layer (Maximum)</option>
                            <option value="3">3-layer (Standard)</option>
                            <option value="1">1-layer (Fast)</option>
                        </select>
                    </div>
                </div>
                <div class="settings-section">
                    <h3>Appearance</h3>
                    <div class="setting-item">
                        <label>Theme</label>
                        <select id="setTheme">
                            <option value="dark">Dark</option>
                            <option value="light">Light</option>
                            <option value="amoled">AMOLED Black</option>
                        </select>
                    </div>
                    <div class="setting-item">
                        <label>Message Size</label>
                        <select id="setMsgSize">
                            <option value="small">Small</option>
                            <option value="medium">Medium</option>
                            <option value="large">Large</option>
                        </select>
                    </div>
                    <div class="setting-item">
                        <label>Show Timestamps</label>
                        <select id="setTimestamps">
                            <option value="on">On</option>
                            <option value="off">Off</option>
                        </select>
                    </div>
                </div>
                <div class="settings-section">
                    <h3>Chat Settings</h3>
                    <div class="setting-item">
                        <label>Message Animation</label>
                        <select id="setAnimation">
                            <option value="slide">Slide In</option>
                            <option value="fade">Fade In</option>
                            <option value="bounce">Bounce</option>
                            <option value="none">None</option>
                        </select>
                    </div>
                    <div class="setting-item">
                        <label>Enter to Send</label>
                        <select id="setEnterSend">
                            <option value="on">On</option>
                            <option value="off">Off</option>
                        </select>
                    </div>
                    <div class="setting-item">
                        <label>Typing Indicators</label>
                        <select id="setTyping">
                            <option value="on">On</option>
                            <option value="off">Off</option>
                        </select>
                    </div>
                </div>
                <div class="settings-section">
                    <h3>Danger Zone</h3>
                    <button class="btn btn-danger" id="deleteAccountBtn">Delete Account</button>
                    <button class="btn btn-danger" id="logoutBtn">Logout</button>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" id="saveSettings">Save Settings</button>
            </div>
        </div>
    </div>

    <script src="crypto.js"></script>
    <script src="database.js"></script>
    <script src="app.js"></script>
</body>
</html>
